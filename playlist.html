<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>playlist.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/site.css" />
  <style>
    body { margin: 0; background: #000; color: #fff; }
    .pl-grid {
      display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
      gap:12px; padding:12px;
    }
    .pl-card {
      border:2px solid #fff; padding:10px; background:#000; color:#fff;
      display:flex; flex-direction:column; gap:8px; min-height:120px;
      overflow: hidden;
    }
    .pl-card.pl-accent-0 { border-color: #1ea92f; } /* green */
    .pl-card.pl-accent-1 { border-color: #4fc3ff; } /* sky blue */
    .pl-card.pl-accent-2 { border-color: #ffd84d; } /* yellow */
    .pl-card.pl-playing { border-width:3px; border-color:#e00; box-shadow: none; }
    .pl-title { font-size:14px; line-height:1.3; }
    .pl-actions { display:flex; gap:6px; }
    .pl-card img,
    .pl-card iframe,
    .pl-card video,
    .pl-card object {
      display: block;
      max-width: 100%;
      max-height: 180px;
      width: 100%;
      height: auto;
      object-fit: cover;
    }
    .pl-actions button {
      border:1px solid #fff; background:#000; color:#fff; padding:6px 8px; cursor:pointer; border-radius:4px;
    }
  </style>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
</head>
<body>
  <main>
    <section class="pl-grid" id="plGrid" aria-label="playlist"></section>
  </main>

  <script type="module">
    function normalizeTrackText(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/[–—]/g, '-')
        .replace(/\s+/g, ' ')
        .trim();
    }

    async function loadGrid() {
      const grid = document.getElementById('plGrid');
      const res = await fetch('/data/playlist-soundcloud.json', { cache:'no-cache' });
      const items = await res.json();

      grid.innerHTML = '';
      items.forEach((it, i) => {
        const card = document.createElement('div');
        card.className = `pl-card pl-accent-${i % 3}`;
        card.dataset.index = String(i);
        card.dataset.titleNorm = normalizeTrackText(it.title || it.url);
        const t = document.createElement('div');
        t.className = 'pl-title';
        t.textContent = it.title || it.url;

        const actions = document.createElement('div');
        actions.className = 'pl-actions';
        const playBtn = document.createElement('button');
        playBtn.textContent = 'Play';
        playBtn.addEventListener('click', () => (window.opener || window).SC_MBAR?.cue(i));

        const openBtn = document.createElement('button');
        openBtn.textContent = 'Open';
        openBtn.addEventListener('click', () => window.open(it.url, '_blank', 'noopener'));

        actions.append(playBtn, openBtn);
        card.append(t, actions);
        grid.append(card);
      });

      function applyHighlight() {
        try {
          const st = (window.opener || window).SC_MBAR?.getState?.();
          if (!st) return;
          document.querySelectorAll('.pl-card.pl-playing').forEach(el => el.classList.remove('pl-playing'));

          const stateTitle = normalizeTrackText(st.title);
          let target = null;

          if (stateTitle) {
            const cards = Array.from(grid.querySelectorAll('.pl-card'));
            target = cards.find((card) => {
              const cardTitle = card.dataset.titleNorm || '';
              return cardTitle === stateTitle || cardTitle.includes(stateTitle) || stateTitle.includes(cardTitle);
            }) || null;
          }

          if (!target && typeof st.index === 'number') {
            target = grid.querySelector(`.pl-card[data-index="${st.index}"]`);
          }

          if (target) target.classList.add('pl-playing');
        } catch {}
      }

      applyHighlight();
      setInterval(applyHighlight, 1000);
    }
    document.addEventListener('turbo:load', loadGrid);
    if (document.readyState !== 'loading') loadGrid();
    else document.addEventListener('DOMContentLoaded', loadGrid);
  </script>
</body>
</html>
