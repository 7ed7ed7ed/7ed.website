<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>projects.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/site.css" />
  <style>
    html, body { height: 100%; }
    body { margin: 0; background: #111; color: #eee; }
    .pdf-wrap {
      height: 100vh;
      padding: 10px;
      box-sizing: border-box;
    }
    .pdf-layout {
      height: 100%;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      gap: 10px;
      min-height: 0;
    }
    .pdf-picker {
      height: 100%;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr;
      align-content: start;
      gap: 10px;
      padding-right: 2px;
    }
    .pdf-card {
      border: 0;
      background: transparent;
      color: #eee;
      padding: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      font: inherit;
    }
    .pdf-card.is-active .pdf-thumb {
      border-color: #ff0000;
      box-shadow: inset 0 0 0 1px rgba(255, 0, 0, 0.5);
    }
    .pdf-thumb {
      --thumb-ratio: 4 / 3;
      width: 100%;
      aspect-ratio: var(--thumb-ratio);
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #161616;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      min-height: 120px;
    }
    .pdf-thumb.no-thumb::before {
      content: "PDF";
      font: 700 32px/1 Helvetica, Arial, sans-serif;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.22);
    }
    .pdf-thumb img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center;
    }
    .pdf-card-label {
      display: block;
      width: 100%;
      margin: 6px 0 0 0;
      text-align: left;
      font: 600 12px/1.25 Helvetica, Arial, sans-serif;
      color: #000;
      opacity: 1;
      white-space: normal;
      word-break: break-word;
    }
    .pdf-panel {
      height: 100%;
      min-height: 0;
    }
    .pdf-viewer {
      height: 100%;
      min-height: 0;
      border: 1px solid rgba(255, 255, 255, 0.25);
      overflow: hidden;
      background: #222;
      position: relative;
    }
    .pdf-frame { width: 100%; height: 100%; border: 0; background: #222; }
    .pdf-fallback { padding: 16px; line-height: 1.4; }
    .pdf-fallback a { color: #8ad; }
    @media (max-width: 900px) {
      .pdf-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 220px minmax(0, 1fr);
      }
      .pdf-picker {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        overflow-y: auto;
      }
    }
  </style>
</head>
<body class="intro-light">

  <main class="pdf-wrap">
    <div class="pdf-layout">
      <aside id="pdfPicker" class="pdf-picker" aria-label="Project PDF thumbnails"></aside>

      <section class="pdf-panel">
        <div id="pdfViewer" class="pdf-viewer">
          <iframe id="pdfFrame" class="pdf-frame" title="Projects PDF" src="about:blank"></iframe>
          <div id="pdfFallback" class="pdf-fallback" hidden></div>
        </div>
      </section>
    </div>

    <noscript>
      <div class="pdf-fallback">
        JavaScript is required to load the PDF inline. You can download it directly instead.
      </div>
    </noscript>
  </main>

  <script>
    (function() {
      var frame = document.getElementById('pdfFrame');
      var fallback = document.getElementById('pdfFallback');
      var picker = document.getElementById('pdfPicker');

      // Add/remove entries in this set as needed.
      var pdfSet = [
        {
          src: 'https://pub-d743d8d1f4af41bcaecd76b83ac5c384.r2.dev/cloudflare_R2/portfolio.pdf',
          thumb: 'images/projects_pdfs/thumbnails/portfolio_thumbnail.jpg'
        },
        {
          src: 'https://pub-d743d8d1f4af41bcaecd76b83ac5c384.r2.dev/cloudflare_R2/BTD_2414-11212 Montgomery Rd.pdf',
          thumb: 'images/projects_pdfs/thumbnails/montgomery_thumbnail.jpg'
        },
        {
          src: 'https://pub-d743d8d1f4af41bcaecd76b83ac5c384.r2.dev/cloudflare_R2/BTD_240729-Baldwin House Concept - SD.pdf',
          thumb: 'images/projects_pdfs/thumbnails/baldwin_thumbnail.jpg'
        },
        {
          src: 'https://pub-d743d8d1f4af41bcaecd76b83ac5c384.r2.dev/cloudflare_R2/BTD_2401-828 Chillum Rd.pdf',
          thumb: 'images/projects_pdfs/thumbnails/chillum_thumbnail.jpg'
        }
      ];

      function fileLabel(path) {
        try {
          var file = path.split('/').pop() || path;
          return decodeURIComponent(file);
        } catch (_) {
          return path;
        }
      }

      function renderPicker(activeIndex) {
        picker.innerHTML = '';
        pdfSet.forEach(function(item, index) {
          var path = item.src;
          var card = document.createElement('button');
          card.type = 'button';
          card.className = 'pdf-card' + (index === activeIndex ? ' is-active' : '');
          card.setAttribute('aria-label', 'Open ' + fileLabel(path));

          var thumb = document.createElement('div');
          thumb.className = 'pdf-thumb no-thumb';
          if (item.thumb) {
            var image = document.createElement('img');
            image.src = encodeURI(item.thumb);
            image.alt = fileLabel(path) + ' thumbnail';
            image.addEventListener('load', function() {
              thumb.classList.remove('no-thumb');
              if (image.naturalWidth > 0 && image.naturalHeight > 0) {
                thumb.style.setProperty('--thumb-ratio', image.naturalWidth + ' / ' + image.naturalHeight);
              }
            });
            image.addEventListener('error', function() {
              thumb.classList.add('no-thumb');
            });
            thumb.appendChild(image);
          }

          var text = document.createElement('span');
          text.className = 'pdf-card-label';
          text.textContent = fileLabel(path);

          card.appendChild(thumb);
          card.appendChild(text);
          card.addEventListener('click', function() { loadAt(index); });
          picker.appendChild(card);
        });
      }

      function loadAt(index) {
        if (!pdfSet.length) return;
        var safeIndex = ((index % pdfSet.length) + pdfSet.length) % pdfSet.length;
        var current = pdfSet[safeIndex];
        frame.src = encodeURI(current.src) + '#view=FitH';
        frame.dataset.index = String(safeIndex);
        renderPicker(safeIndex);
      }

      loadAt(0);

      frame.addEventListener('error', function() {
        frame.hidden = true;
        fallback.hidden = false;
        fallback.innerHTML = 'Could not load PDF.<br/>Select a thumbnail above or try <code>https://pub-d743d8d1f4af41bcaecd76b83ac5c384.r2.dev/cloudflare_R2/portfolio.pdf</code>.';
      });
    })();
  </script>
</body>
</html>
