<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>gallery_36.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/site.css" />
  <link rel="stylesheet" href="css/gallery.css" />
</head>
<body class="intro-light gallery-page gallery-oeuvre">
  <div data-modal-root class="oeuvre-shell">
    <section class="oeuvre-main">
      <figure class="oeuvre-stage">
        <img id="oeuvre-image" class="oeuvre-media" alt="" />
        <video
          id="oeuvre-video"
          class="oeuvre-media"
          playsinline
          preload="metadata"
        ></video>
      </figure>
    </section>

    <header class="oeuvre-head">
      <div class="oeuvre-nav" aria-label="selection navigation">
        <button id="oeuvre-prev" class="oeuvre-nav-btn" type="button" aria-label="Previous image">&lt;</button>
        <button id="oeuvre-next" class="oeuvre-nav-btn" type="button" aria-label="Next image">&gt;</button>
      </div>
      <p id="oeuvre-counter" class="oeuvre-counter">0 of 0</p>
      <div id="oeuvre-thumbs" class="oeuvre-thumbs" aria-label="thumbnail strip"></div>
    </header>
  </div>

  <script type="module" src="js/gallery.js"></script>
</body>
</html>
